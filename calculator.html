<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator - Layanga</title>
<style>
body{background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}
.calc{background:#1e293b;padding:20px;border-radius:20px;box-shadow:0 10px 30px #000;width:300px}
#display{width:100%;height:60px;background:#020617;color:white;font-size:32px;text-align:right;border:none;border-radius:10px;padding:10px;box-sizing:border-box;margin-bottom:15px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer}
.num{background:#334155;color:white}
.op{background:#38bdf8;color:#020617}
.eq{background:#0ea5e9;color:white;grid-column:span 2}
.clear{background:#ef4444;color:white}
</style>
</head>
<body>
<div class="calc">
<input id="display" readonly>
<div class="buttons">
<button class="clear" onclick="c()">C</button>
<button class="op" onclick="add('/')">/</button>
<button class="op" onclick="add('*')">*</button>
<button class="num" onclick="add('7')">7</button>
<button class="num" onclick="add('8')">8</button>
<button class="num" onclick="add('9')">9</button>
<button class="op" onclick="add('-')">-</button>
<button class="num" onclick="add('4')">4</button>
<button class="num" onclick="add('5')">5</button>
<button class="num" onclick="add('6')">6</button>
<button class="op" onclick="add('+')">+</button>
<button class="num" onclick="add('1')">1</button>
<button class="num" onclick="add('2')">2</button>
<button class="num" onclick="add('3')">3</button>
<button class="num" onclick="add('0')">0</button>
<button class="num" onclick="add('.')">.</button>
<button class="eq" onclick="calc()">=</button>
</div>
<br><a href="index.html" style="color:#38bdf8;text-align:center;display:block;text-decoration:none">← Back to Portfolio</a>
</div>
<script>
let d=document.getElementById('display');
function add(v){d.value+=v}
function c(){d.value=''}
function calc(){try{d.value=eval(d.value)}catch{d.value='Error'}}
</script>
</body>
</html>
